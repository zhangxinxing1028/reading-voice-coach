<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朗读音量监督器</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
  background:#f1f6f5;
  color:#263b39;
}
main{max-width:680px;margin:auto;padding:22px 16px 45px}
header{text-align:center;margin:15px 0 25px}
h1{font-size:27px;margin:0 0 8px}
.subtitle{color:#6e8380;font-size:14px}
.card{
  background:white;border-radius:24px;
  padding:24px;margin-bottom:18px;
  box-shadow:0 5px 20px #21453c0c;
}
.status{text-align:center;font-weight:700;font-size:20px}
.number{text-align:center;font-size:57px;font-weight:750;margin:17px 0}
.number small{font-size:18px;color:#768783}
.meter{height:21px;border-radius:50px;background:#e3e9eb;overflow:hidden}
#bar{
  height:100%;width:0%;background:#3b9a83;
  border-radius:50px;transition:width .1s;
}
.labels{display:flex;justify-content:space-between;color:#83918e;
  font-size:13px;margin-top:9px}
.note{text-align:center;color:#6b807a;font-size:14px;margin-top:18px}
.buttons{display:flex;gap:10px;margin-top:22px}
button{
  border:0;border-radius:15px;padding:15px;
  font-size:17px;font-weight:700;cursor:pointer;
}
#start{background:#367f75;color:white;flex:2}
#calibrate{background:#edf3f1;flex:1}
#start.stop{background:#ba5a49}
#test{background:#f2f5f4;font-size:14px;padding:11px 15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#f5f8f7;padding:18px 6px;text-align:center;
  border-radius:17px}
.value{font-weight:750;font-size:24px}
.label{color:#788682;font-size:12px;margin-top:7px}
h2{font-size:21px;margin-top:0}
.setting{margin:23px 0}
.setting-title{display:flex;justify-content:space-between;
  font-weight:650;margin-bottom:12px}
input[type=range]{width:100%;accent-color:#3b9380}
.hint{font-size:13px;color:#80908c;line-height:1.7}
#error{color:#c35b46;white-space:pre-wrap;font-size:14px;margin-top:12px}
#progress{height:6px;background:#e6ecea;border-radius:5px;margin-top:20px}
#progressFill{width:0%;height:100%;background:#e2a74d;
  border-radius:5px;transition:width .1s}
.alert{background:#fff0e7!important}
.alert .status{color:#ba573d}
footer{text-align:center;font-size:12px;color:#87938f;line-height:1.8}
</style>
</head>
<body>
<main>
<header>
<h1>📖 朗读音量监督器</h1>
<div class="subtitle">帮助孩子养成清晰、大声朗读的习惯</div>
</header>

<section class="card" id="monitor">
<div class="status" id="status">准备开始</div>
<div class="number"><span id="db">—</span><small> dBFS</small></div>
<div class="meter"><div id="bar"></div></div>
<div class="labels">
<span>安静</span><span>声音合适</span><span>响亮</span>
</div>
<div class="note" id="message">点击开始监测，允许使用麦克风</div>
<div id="progress"><div id="progressFill"></div></div>
<div class="buttons">
<button id="start">▶ 开始监测</button>
<button id="calibrate">校准音量</button>
</div>
<div id="error"></div>
</section>

<section class="card">
<div class="stats">
<div class="stat"><div class="value" id="duration">00:00</div>
<div class="label">累计监测</div></div>
<div class="stat"><div class="value" id="rate">0%</div>
<div class="label">声音合格率</div></div>
<div class="stat"><div class="value" id="alarms">0</div>
<div class="label">提醒次数</div></div>
</div>
</section>

<section class="card">
<h2>⚙️ 朗读设置</h2>
<div class="setting">
<div class="setting-title">
<span>最低声音要求</span><span id="thresholdValue">-38 dBFS</span>
</div>
<input type="range" id="threshold" min="-65" max="-10" value="-38">
<p class="hint">数值越接近 0，要求声音越响亮。
建议先正常朗读几句，再点击“校准音量”。</p>
</div>
<div class="setting">
<div class="setting-title">
<span>声音过小多久提醒</span><span id="secondsValue">3 秒</span>
</div>
<input type="range" id="seconds" min="1" max="10" value="3">
</div>
<div class="setting">
<div class="setting-title">
<span>提醒音量</span><span id="volumeValue">35%</span>
</div>
<input type="range" id="volume" min="5" max="80" value="35">
</div>
<button id="test">♪ 测试提示音</button>
</section>

<footer>
声音仅在设备本地分析，不录音、不上传。<br>
请保持浏览器页面处于前台，并保持屏幕常亮。<br>
dBFS 为数字音频音量，不等于专业分贝仪的 dB SPL。
</footer>
</main>

<script>
const $ = id => document.getElementById(id);
let context, stream, source, analyser, data, frameId;
let running = false, reading = false, alarm = false;
let quietSince = null, lastBeep = 0, ignoreUntil = 0;
let startTime = 0, totalSamples = 0, goodSamples = 0;
let alarmCount = 0, lastRender = 0;
let calibration = null;
let level = -100;

const threshold = $("threshold");
const seconds = $("seconds");
const volume = $("volume");

threshold.oninput = () => {
  $("thresholdValue").textContent = threshold.value + " dBFS";
};
seconds.oninput = () => {
  $("secondsValue").textContent = seconds.value + " 秒";
};
volume.oninput = () => {
  $("volumeValue").textContent = volume.value + "%";
};

function setStatus(title, message, isAlert=false) {
  $("status").textContent = title;
  $("message").textContent = message;
  $("monitor").classList.toggle("alert", isAlert);
}

function beep() {
  if (!context) {
    const AC = window.AudioContext || window.webkitAudioContext;
    context = new AC();
  }
  if (context.state === "suspended") context.resume();
  const now = context.currentTime;
  const osc = context.createOscillator();
  const gain = context.createGain();
  osc.type = "sine";
  osc.frequency.value = 720;
  const v = Number(volume.value) / 100 * 0.25;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(Math.max(v,0.001), now+0.025);
  gain.gain.exponentialRampToValueAtTime(0.0001, now+0.2);
  osc.connect(gain);
  gain.connect(context.destination);
  osc.start(now);
  osc.stop(now+0.21);
  ignoreUntil = performance.now()+300;
}

$("test").onclick = async () => {
  try { beep(); }
  catch(e) { $("error").textContent = e.message; }
};

function displayTime(ms) {
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,"0")
    + ":" + String(s%60).padStart(2,"0");
}

function resetCounters() {
  reading = false; alarm = false;
  quietSince = null; lastBeep = 0;
  totalSamples = 0; goodSamples = 0; alarmCount = 0;
  level = -100;
  $("alarms").textContent = "0";
  $("rate").textContent = "0%";
  $("duration").textContent = "00:00";
  $("progressFill").style.width = "0%";
}

function tick(t) {
  if (!running) return;
  analyser.getFloatTimeDomainData(data);

  let sum = 0;
  for (let i=0; i<data.length; i++) sum += data[i]*data[i];
  const rms = Math.sqrt(sum/data.length);
  const db = Math.max(-100,20*Math.log10(Math.max(rms,0.00001)));
  level = db;

  const minimum = Number(threshold.value);
  const delay = Number(seconds.value)*1000;

  if (calibration) {
    if (db > -90) calibration.samples.push(db);
    if (t >= calibration.until) {
      const values = calibration.samples.sort((a,b)=>a-b);
      if (values.length > 5) {
        const median = values[Math.floor(values.length/2)];
        const suggested = Math.max(-65,Math.min(-10,Math.round(median-8)));
        threshold.value = suggested;
        threshold.oninput();
        setStatus("校准完成","最低音量已自动设置为 "+suggested+" dBFS");
      } else {
        setStatus("校准失败","没有检测到足够的朗读声音，请重试");
      }
      calibration = null;
      quietSince = null;
    }
  } else if (t > ignoreUntil) {
    if (!reading) {
      if (db >= minimum+2) {
        reading = true;
        setStatus("朗读中","已经检测到朗读声音");
      } else {
        setStatus("等待朗读","请先正常读出一句话");
      }
    } else {
      totalSamples++;
      if (db >= minimum) {
        goodSamples++;
        quietSince = null;
        alarm = false;
        setStatus("声音合适","继续保持清晰朗读");
      } else {
        if (quietSince === null) quietSince = t;
        const elapsed = t-quietSince;
        if (elapsed >= delay) {
          if (!alarm) {
            alarm = true;
            alarmCount++;
            $("alarms").textContent = alarmCount;
          }
          setStatus("🔔 声音太小","请提高朗读音量",true);
          if (t-lastBeep >= 1100) {
            lastBeep = t;
            beep();
          }
        } else {
          alarm = false;
          setStatus("声音偏小","请稍微提高音量");
        }
      }
    }
  }

  if (t-lastRender > 100) {
    lastRender = t;
    $("db").textContent = db <= -95 ? "—" : db.toFixed(1);
    $("bar").style.width =
      Math.max(0,Math.min(100,(db+80)/75*100))+"%";
    $("duration").textContent = displayTime(Date.now()-startTime);
    if (totalSamples > 0)
      $("rate").textContent =
        Math.round(goodSamples/totalSamples*100)+"%";
    const pending = quietSince === null ? 0 :
      Math.max(0,Math.min(100,(t-quietSince)/delay*100));
    $("progressFill").style.width = pending+"%";
  }
  frameId = requestAnimationFrame(tick);
}

async function startMonitor() {
  $("error").textContent = "";
  try {
    if (!navigator.mediaDevices?.getUserMedia)
      throw new Error("当前浏览器无法使用麦克风，请用 Chrome 打开 HTTPS 网页。");

    if (navigator.audioSession) {
      try { navigator.audioSession.type = "play-and-record"; }
      catch(e) {}
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:false,
        noiseSuppression:false,
        autoGainControl:false
      }
    });

    const AC = window.AudioContext || window.webkitAudioContext;
    context = new AC();
    await context.resume();
    source = context.createMediaStreamSource(stream);
    analyser = context.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);
    data = new Float32Array(analyser.fftSize);

    resetCounters();
    startTime = Date.now();
    running = true;
    $("start").textContent = "■ 停止监测";
    $("start").classList.add("stop");
    frameId = requestAnimationFrame(tick);
  } catch(e) {
    running = false;
    if (stream) stream.getTracks().forEach(x=>x.stop());
    stream = null;
    if (context) {
      try { await context.close(); } catch(x) {}
      context = null;
    }
    setStatus("启动失败","请检查麦克风权限");
    $("error").textContent =
      "错误："+e.message+
      "\n请在 Chrome 独立打开 HTTPS 网页，并允许麦克风权限。";
  }
}

async function stopMonitor() {
  running = false;
  cancelAnimationFrame(frameId);
  if (stream) stream.getTracks().forEach(x=>x.stop());
  stream = null;
  if (context) {
    try { await context.close(); } catch(e) {}
    context = null;
  }
  reading = false;
  alarm = false;
  calibration = null;
  $("start").textContent = "▶ 开始监测";
  $("start").classList.remove("stop");
  $("progressFill").style.width = "0%";
  setStatus("已停止","点击开始监测可以重新练习");
}

$("start").onclick = async () => {
  if (running) await stopMonitor();
  else await startMonitor();
};

$("calibrate").onclick = () => {
  if (!running) {
    $("error").textContent = "请先点击“开始监测”，再校准音量。";
    return;
  }
  $("error").textContent = "";
  calibration = {
    until:performance.now()+2500,
    samples:[]
  };
  setStatus("正在校准","请用正常朗读音量连续读 2～3 秒");
};

window.addEventListener("pagehide", () => {
  if (running) stopMonitor();
});
</script>
</body>
  </html>
